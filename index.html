<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人面談 予約システム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f4f7f6;
      color: #333;
    }
    .header-banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 0;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      background-color: white;
    }
    .card-header {
      background-color: #fff;
      border-bottom: 2px solid #f0f0f0;
      font-weight: 700;
      color: #4a5568;
      padding: 15px 20px;
    }
    .time-slot-btn {
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      font-weight: 500;
      border: 2px solid #e2e8f0;
      background-color: #fff;
      color: #4a5568;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-align: center;
    }
    .time-slot-btn:hover:not([disabled]) {
      border-color: #667eea;
      color: #667eea;
      background-color: #f8fafc;
    }
    .time-slot-btn.selected {
      background-color: #667eea;
      border-color: #667eea;
      color: white;
    }
    .time-slot-btn[disabled] {
      background-color: #edf2f7;
      border-color: #edf2f7;
      color: #a0aec0;
      cursor: not-allowed;
    }
    .badge-status {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }
    .date-section {
      margin-bottom: 25px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 15px;
    }
    .date-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    .date-title::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 18px;
      background-color: #667eea;
      margin-right: 8px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="header-banner">
    <h2>🤝 個人面談 ご予約受付</h2>
    <p class="mb-0 mt-2">ご希望のクラス、日時を選択してご予約を完了させてください。</p>
  </div>

  <div class="container mb-5">
    <div id="deadlineMessage" class="alert alert-warning d-none text-center fw-bold" role="alert"></div>

    <div class="row" id="mainContent">
      <div class="col-lg-5 mb-4">
        <div class="card">
          <div class="card-header">📋 基本情報の入力</div>
          <div class="card-body p-4">
            <form id="reserveForm">
              <div class="mb-3">
                <label class="form-label fw-bold">クラス <span class="text-danger">*</span></label>
                <select class="form-select" id="classSelect" required>
                  <option value="" disabled selected>クラスを選択してください</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">園児氏名 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="childName" placeholder="例：ひよこ たろう" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">面談形式 <span class="text-danger">*</span></label>
                <div class="d-flex gap-3 mt-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="meetingType" id="type1" value="対面形式" checked>
                    <label class="form-check-label" for="type1">🏢 対面形式</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="meetingType" id="type2" value="オンライン" >
                    <label class="form-check-label" for="type2">💻 オンライン</label>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">保護者メールアドレス <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="parentEmail" placeholder="例：example@mail.com" required>
                <div class="form-text">予約完了通知メールがこのアドレスに届きます。</div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">備考（特記事項など）</label>
                <textarea class="form-control" id="remarks" rows="3" placeholder="先生に伝えておきたいことがあればご記入ください"></textarea>
              </div>

              <div class="p-3 bg-light rounded mb-4 border d-none" id="selectionSummary">
                <div class="fw-bold text-secondary small">【選択中の日時】</div>
                <div id="selectedDateTimeText" class="fw-bold text-primary fs-5 mt-1"></div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border:none;" id="submitBtn">
                🚀 この内容で予約を確定する
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>📅 面談希望日時の選択</span>
            <span class="badge bg-secondary" id="totalSlotsCount">0枠</span>
          </div>
          <div class="card-body p-4" style="max-height: 650px; overflow-y: auto;" id="calendarContainer">
            <div class="text-center text-muted my-5" id="calendarPlaceholder">
              <p class="fs-5">Loading...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="loadingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content text-center p-4">
        <div class="spinner-border text-primary mx-auto mb-3" role="status"></div>
        <div class="fw-bold">データを送信中...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 💡 ここにご自身の最新のGASウェブアプリURLを貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKaY2_hDrqHheBqLlGnfXA4lxYM9h7JuSlviAGuL_taHnZBclfxA9JBGEvutnu-htO/exec"; 

    let systemData = { classes: [], dates: [], times: [], reserves: [], config: {} };
    let selectedDate = null;
    let selectedTime = null;

    // 読み込み初期化
    window.addEventListener('DOMContentLoaded', () => {
      fetchSystemData();
      
      // クラスが選ばれても選ばれていなくても、カレンダーを常に共通表示させる
      document.getElementById('classSelect').addEventListener('change', () => {
        renderCalendar(); 
      });

      document.getElementById('reserveForm').addEventListener('submit', handleFormSubmit);
    });

    // GASからデータを取得
    function fetchSystemData() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          systemData = data;
          checkSystemDeadline();
          populateClasses();
          renderCalendar(); // 最初からカレンダーを表示する
        })
        .catch(err => {
          console.error(err);
          document.getElementById('calendarPlaceholder').innerHTML = '<span class="text-danger">データの読み込みに失敗しました。再読み込みしてください。</span>';
        });
    }

    // 締め切りチェック機能（そのまま維持）
    function checkSystemDeadline() {
      const conf = systemData.config || {};
      if (conf.deadlineStatus === "closed") {
        showDeadline("⛔ 個人面談の事前予約受付は一斉終了いたしました。");
        return;
      }
      if (conf.deadlineDate) {
        const dlTime = new Date(conf.deadlineDate).getTime();
        if (new Date().getTime() > dlTime) {
          showDeadline("⛔ 設定された予約締め切り日時を過ぎたため、受付を終了いたしました。");
        }
      }
    }

    function showDeadline(msg) {
      const dMsg = document.getElementById('deadlineMessage');
      dMsg.innerText = msg;
      dMsg.classList.remove('d-none');
      document.getElementById('mainContent').classList.add('d-none');
    }

    // クラス選択肢の生成
    function populateClasses() {
      const select = document.getElementById('classSelect');
      select.innerHTML = '<option value="" disabled selected>クラスを選択してください</option>';
      if (systemData.classes) {
        systemData.classes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.innerText = c.name;
          select.appendChild(opt);
        });
      }
    }

    // 💡 カレンダー（面談枠）の生成処理【クラスごとのフィルターを完全に除去】
    function renderCalendar() {
      const container = document.getElementById('calendarContainer');
      container.innerHTML = '';
      
      // 時間枠データを日付順にソートして整理
      let slots = systemData.times || [];
      if (slots.length === 0) {
        container.innerHTML = '<div class="text-center text-muted my-5">現在、選択可能な面談日時枠がありません。</div>';
        document.getElementById('totalSlotsCount').innerText = '0枠';
        return;
      }

      document.getElementById('totalSlotsCount').innerText = slots.length + '枠';

      // 日付ごとに時間枠をグループ化
      const groupedSlots = {};
      slots.forEach(s => {
        if (!groupedSlots[s.date]) { groupedSlots[s.date] = []; }
        groupedSlots[s.date].push(s);
      });

      // 日付の古い順に並び替えて画面に書き出す
      const sortedDates = Object.keys(groupedSlots).sort((a,b) => new Date(a) - new Date(b));

      sortedDates.forEach(dateStr => {
        const dateSection = document.createElement('div');
        dateSection.className = 'date-section';

        // 日付タイトルのフォーマット（例：2026年06月23日）
        const dObj = new Date(dateStr);
        const formattedDate = dObj.getFullYear() + '年' + (dObj.getMonth()+1) + '月' + dObj.getDate() + '日';
        
        const title = document.createElement('div');
        title.className = 'date-title';
        title.innerText = formattedDate;
        dateSection.appendChild(title);

        const row = document.createElement('div');
        row.className = 'row row-cols-2 row-cols-md-3 g-2';

        // その日の時間枠ボタンを生成
        groupedSlots[dateStr].forEach(slot => {
          const col = document.createElement('div');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'time-slot-btn';
          
          // 💡 すでに予約データシートに同じ日付・同じ時間枠が存在するかチェック（埋まり判定）
          const isTaken = systemData.reserves.some(r => r.date === slot.date && String(r.time) === String(slot.time));

          if (isTaken) {
            btn.disabled = true;
            btn.innerHTML = slot.time + ' <span class="badge bg-danger badge-status">満席</span>';
          } else {
            btn.innerHTML = slot.time + ' <span class="badge bg-success badge-status">受付中</span>';
            
            // 選択済みの状態を維持
            if (selectedDate === slot.date && selectedTime === slot.time) {
              btn.classList.add('selected');
            }

            // ボタンクリック時の挙動
            btn.addEventListener('click', () => {
              document.querySelectorAll('.time-slot-btn').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
              selectedDate = slot.date;
              selectedTime = slot.time;
              
              // 選択中テキストの表示更新
              const summary = document.getElementById('selectionSummary');
              const text = document.getElementById('selectedDateTimeText');
              text.innerText = formattedDate + '  ' + slot.time;
              summary.classList.remove('d-none');
            });
          }

          col.appendChild(btn);
          row.appendChild(col);
        });

        dateSection.appendChild(row);
        container.appendChild(dateSection);
      });
    }

    // 予約フォーム送信処理（変更なし）
    function handleFormSubmit(e) {
      e.preventDefault();

      if (!selectedDate || !selectedTime) {
        alert('📅 面談希望日時が選択されていません。右側のカレンダーから時間枠を1つ選択してください。');
        return;
      }

      // 各入力欄の値を取得
      const className = document.getElementById('classSelect').value;
      const childName = document.getElementById('childName').value.trim();
      const meetingType = document.querySelector('name[name="meetingType"]:checked') ? document.querySelector('name[name="meetingType"]:checked').value : document.querySelector('input[name="meetingType"]:checked').value;
      const email = document.getElementById('parentEmail').value.trim();
      const comment = document.getElementById('remarks').value.trim();

      const payload = {
        type: "submitReservation",
        date: selectedDate,
        time: selectedTime,
        class: className,
        name: childName,
        meetingType: meetingType,
        email: email,
        comment: comment
      };

      const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
      loadingModal.show();

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(res => res.json())
      .then(res => {
        loadingModal.hide();
        if (res.status === 'success') {
          alert('🎉 ご予約が完了いたしました！\nご入力いただいたメールアドレス宛に通知をお送りしましたのでご確認ください。');
          location.reload();
        } else if (res.status === 'exists') {
          // 同名重複、または直前タッチの同時重複エラーをキャッチ
          alert(res.message || '⚠️ 申し訳ありません。この枠はタッチの差で別の方の予約が完了したか、または同じお名前の園児氏名で既に別の予約が入っています。');
          location.reload();
        } else {
          alert('システムエラーが発生しました: ' + (res.message || '不明な原因'));
        }
      })
      .catch(err => {
        loadingModal.hide();
        console.error(err);
        alert('通信エラーが発生しました。インターネット接続を確認し、もう一度お試しください。');
      });
    }
  </script>
</body>
</html>
