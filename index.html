<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人面談のご予約</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f7f9fa; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #ff8c00; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select, input[type="text"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .radio-group { display: flex; gap: 20px; }
        .time-slots { display: flex; flex-direction: column; gap: 10px; }
        .time-slot { display: flex; justify-content: space-between; padding: 12px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .time-slot.available:hover { border-color: #ff8c00; background-color: #fff9f2; }
        .time-slot.selected { border-color: #ff8c00; background-color: #ff8c00; color: white; }
        .time-slot.booked { background-color: #eee; color: #aaa; cursor: not-allowed; }
        .submit-btn { width: 100%; padding: 14px; background-color: #ff8c00; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app" class="container">
    <h2>個人面談のご予約</h2>
    <div v-if="loading" style="text-align:center;">最新の空き状況を読み込み中...</div>
    <div v-else>
        
        <div class="form-group">
            <label>1. お子様のお名前を入力してください</label>
            <input type="text" v-model="childName" placeholder="例：園児 太郎">
        </div>

        <div class="form-group">
            <label>2. クラスを選択してください</label>
            <select v-model="selectedClass">
                <option value="" disabled>選択してください</option>
                <option v-for="c in classes" :key="c.id" :value="c.name">{{ c.name }}</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. 希望日を選択してください</label>
            <select v-model="selectedDate" @change="selectedSlot = null">
                <option value="" disabled>日付を選択してください</option>
                <option v-for="d in dates" :key="d.id" :value="d.name">
                    {{ formatDateLabel(d.name) }}
                </option>
            </select>
        </div>

        <div class="form-group" v-if="selectedDate">
            <label>4. 希望時間を選択してください（各枠先着1名）</label>
            <div class="time-slots">
                <div v-for="slot in filteredSlots" :key="slot.time" class="time-slot"
                     :class="{ 'booked': slot.isBooked, 'selected': selectedSlot === slot.time, 'available': !slot.isBooked }"
                     @click="!slot.isBooked && (selectedSlot = slot.time)">
                    <span>{{ slot.time }}</span>
                    <span>{{ slot.isBooked ? '× 満席' : (selectedSlot === slot.time ? '選択中' : '◯ 予約可能') }}</span>
                </div>
            </div>
            <p v-if="filteredSlots.length === 0" style="color:#718096;">この日の面談枠は設定されていません。</p>
        </div>

        <div class="form-group">
            <label>5. 面談形式を選択してください</label>
            <div class="radio-group">
                <label><input type="radio" value="対面" v-model="meetingType"> 対面</label>
                <label><input type="radio" value="Zoom" v-model="meetingType"> Zoom</label>
            </div>
        </div>

        <div class="form-group">
            <label>6. リマインドを受け取るメールアドレス</label>
            <input type="email" v-model="email" placeholder="例：example@mail.com">
        </div>

        <button class="submit-btn" :disabled="!isFormValid || submitting" @click="submitReservation">
            {{ submitting ? '送信中...' : '予約を確定する' }}
        </button>
    </div>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzZrLTa9OdFZNL0fQPrknVjKnXW1byo2vj3X1Dn4iH0Z68oW2K9C1t9AoU7EXZr9yDH/exec"; // ★ここにURL

    createApp({
        setup() {
            const loading = ref(true);
            const submitting = ref(false);
            
            const childName = ref('');
            const selectedClass = ref('');
            const selectedDate = ref('');
            const selectedSlot = ref(null);
            const meetingType = ref('対面');
            const email = ref('');

            const classes = ref([]);
            const dates = ref([]);
            const allTimes = ref([]);
            const reserves = ref([]);

            const init = async () => {
                try {
                    const res = await fetch(GAS_URL);
                    const json = await res.json();
                    classes.value = json.classes;
                    dates.value = json.dates;
                    allTimes.value = json.times;
                    reserves.value = json.reserves;
                } catch (e) { alert("データの取得に失敗しました。"); }
                finally { loading.value = false; }
            };
            onMounted(init);

            // 💡長い日時表記を「yyyy/MM/dd」の形に綺麗に変換する関数
            const formatDateLabel = (dateVal) => {
                if (!dateVal) return '';
                const d = new Date(dateVal);
                if (isNaN(d.getTime())) return dateVal;
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yyyy}/${mm}/${dd}`;
            };

            // 選択した日付に紐づく時間だけを抽出し、満席チェックを行うコード
            const filteredSlots = computed(() => {
                if (!selectedDate.value) return [];
                return allTimes.value
                    .filter(t => t.date === selectedDate.value)
                    .map(t => {
                        const isBooked = reserves.value.some(r => r.date === selectedDate.value && r.time === t.time);
                        return { time: t.time, isBooked: isBooked };
                    });
            });

            const isFormValid = computed(() => {
                return childName.value.trim() && selectedClass.value && selectedDate.value && selectedSlot.value && email.value.trim();
            });

            const submitReservation = async () => {
                submitting.value = true;
                try {
                    const res = await fetch(GAS_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            type: "reserve", childName: childName.value, selectedClass: selectedClass.value,
                            date: selectedDate.value, timeSlot: selectedSlot.value, meetingType: meetingType.value, email: email.value
                        })
                    });
                    const result = await res.json();
                    if (result.status === "success") { alert("予約が確定しました！"); window.location.reload(); }
                    else { alert(result.message); window.location.reload(); }
                } catch (e) { alert("通信エラーが発生しました"); }
                finally { submitting.value = false; }
            };

            return { loading, submitting, childName, selectedClass, selectedDate, selectedSlot, meetingType, email, classes, dates, filteredSlots, isFormValid, submitReservation, formatDateLabel };
        }
    }).mount('#app');
</script>
</body>
</html>
