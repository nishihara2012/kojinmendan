<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人面談 予約システム</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f4; margin: 0; padding: 20px; color: #4a4a4a; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: #2d3748; font-size: 1.4rem; margin-bottom: 25px; font-weight: bold; letter-spacing: 0.05em; }
        
        label { display: block; margin-top: 20px; font-weight: bold; color: #2d3748; font-size: 0.95rem; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 11px; margin-top: 6px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; background: #fafafa; color: #4a4a4a; transition: border-color 0.2s; }
        input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus { border-color: #718096; outline: none; background: #fff; }
        
        .grid-dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 8px; }
        .btn-choice { border: 1px solid #cbd5e0; background: #fff; padding: 12px 8px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.9rem; color: #4a4a4a; transition: all 0.2s; }
        .btn-choice:hover:not(:disabled) { border-color: #4a5568; background: #f7fafc; }
        .btn-choice.selected { background: #4a6b58; color: #fff; border-color: #3b5445; }
        .btn-choice:disabled { background: #edf2f7; color: #a0aec0; cursor: not-allowed; border-color: #e2e8f0; }

        .time-box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 45px; }
        .status-txt { font-size: 0.75rem; margin-top: 3px; }
        .status-txt.ok { color: #4a6b58; font-weight: bold; }
        .status-txt.full { color: #e53e3e; }

        button.submit-btn { width: 100%; padding: 14px; background: #4a6b58; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 30px; transition: background 0.2s; }
        button.submit-btn:hover:not(:disabled) { background: #3b5445; }
        button.submit-btn:disabled { background: #cbd5e0; color: #a0aec0; cursor: not-allowed; }

        .loading-banner { text-align: center; padding: 12px; background: #e6fffa; color: #234e52; font-weight: bold; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; }
        .deadline-msg { text-align: center; background: #fff5f5; color: #c53030; padding: 18px; border-radius: 6px; font-weight: bold; margin-top: 15px; border: 1px solid #fed7d7; line-height: 1.5; font-size: 0.95rem; }
    </style>
</head>
<body>
<div id="app" class="container">
    <h1>📅 個人面談 予約受付</h1>

    <div v-if="loading" class="loading-banner">🔄 空き状況を読み込み中...</div>

    <div v-if="isSystemClosed" class="deadline-msg">
        ⚠️ インターネット予約受付は終了いたしました。<br>変更・キャンセル等は園まで直接ご連絡ください。
    </div>

    <div v-else>
        <label>🏫 クラス</label>
        <select v-model="form.class">
            <option value="">-- 選択してください --</option>
            <option v-for="c in classes" :key="c.id" :value="c.name">{{ c.name }}</option>
        </select>

        <label>👦 園児氏名</label>
        <input type="text" v-model="form.name" placeholder="例：ひらがな たろう">

        <label>🤝 面談形式</label>
        <select v-model="form.meetingType">
            <option value="対面形式">園での対面形式（来園）</option>
            <option value="オンライン(Zoom)">オンライン形式（Zoom面談）</option>
        </select>

        <label>✉️ 控えメール送信先アドレス</label>
        <input type="email" v-model="form.email" placeholder="例：parent@example.com">
        <p style="font-size:0.75rem; color:#718096; margin:6px 0 0 2px;">※予約完了後、こちらのアドレスに自動控えメールが届きます。</p>

        <label>📅 ご希望の日付</label>
        <div class="grid-dates">
            <button 
                v-for="d in dates" 
                :key="d.id"
                class="btn-choice"
                :class="{ selected: form.date === d.date }"
                :disabled="isDateClosed(d.date)"
                @click="selectDate(d.date)"
            >
                {{ formatDisplayDate(d.date) }}
                <div v-if="isDateClosed(d.date)" style="font-size:0.7rem; color:#e53e3e; margin-top:2px;">締切</div>
            </button>
        </div>

        <div v-if="form.date">
            <label style="margin-top:20px;">🕒 ご希望の時間枠</label>
            <div class="grid-dates">
                <button 
                    v-for="t in availableTimes" 
                    :key="t.id"
                    class="btn-choice"
                    :class="{ selected: form.time === t.time }"
                    :disabled="isFull(t.time)"
                    @click="form.time = t.time"
                >
                    <div class="time-box">
                        <span>{{ t.time }}</span>
                        <span class="status-txt" :class="isFull(t.time) ? 'full' : 'ok'">
                            {{ isFull(t.time) ? '満席' : '○ 空き' }}
                        </span>
                    </div>
                </button>
            </div>
            <p v-if="availableTimes.length === 0" style="text-align:center; color:#e53e3e; font-size:0.9rem; padding:10px;">
                選択された日付には時間枠が設定されていません。
            </p>
        </div>

        <label>✏️ 備考（伝達事項などがあればご記入ください）</label>
        <textarea v-model="form.note" rows="3" placeholder="ご質問など（任意）"></textarea>

        <button 
            class="submit-btn" 
            :disabled="loading || !isFormValid"
            @click="submitReservation"
        >
            {{ loading ? '⏳ 送信中...' : 'この内容で予約を確定する' }}
        </button>
    </div>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;
    
    // ⚠️ 管理画面（admin.html）と同じ最新のデプロイURLに書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxkQ4y-UD3NZDaUCV1CchEDoJy8ptOmxHlzrBvcRNwkHpZxG6pNaazGz7M18Uj19uMx/exec";

    createApp({
        setup() {
            const loading = ref(false);
            const classes = ref([]); const dates = ref([]); const times = ref([]); const reserves = ref([]);
            const config = ref({ deadlineType: "none", deadlineAbsolute: "", deadlineDays: 1 });
            
            const form = ref({ class: "", name: "", meetingType: "対面形式", email: "", date: "", time: "", note: "" });

            const formatDisplayDate = (dStr) => {
                if(!dStr) return "";
                let s = String(dStr).trim().replace(/\//g, "-");
                let m = s.match(/^(\d{4})[-年](\d{1,2})[-月](\d{1,2})/);
                if(m) return `${Number(m[2])}月${Number(m[3])}日`;
                return dStr;
            };

            const loadData = async () => {
                loading.value = true;
                try {
                    const res = await fetch(GAS_URL); const json = await res.json();
                    classes.value = json.classes || [];
                    dates.value = json.dates || [];
                    times.value = json.times || [];
                    reserves.value = json.reserves || [];
                    if (json.config) config.value = json.config;
                } catch(e) {
                    alert("データの読み込みに失敗しました。時間をおいて再度お試しください。");
                } finally { loading.value = false; }
            };

            const isSystemClosed = computed(() => {
                if (config.value.deadlineType === 'absolute' && config.value.deadlineAbsolute) {
                    const now = new Date(); const limit = new Date(config.value.deadlineAbsolute);
                    return now >= limit;
                }
                return false;
            });

            const isDateClosed = (dateStr) => {
                if (config.value.deadlineType === 'relative' && config.value.deadlineDays) {
                    const now = new Date(); now.setHours(0,0,0,0);
                    const targetDate = new Date(dateStr.replace(/\//g, "-")); targetDate.setHours(0,0,0,0);
                    const diffTime = targetDate.getTime() - now.getTime();
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return diffDays < Number(config.value.deadlineDays);
                }
                return false;
            };

            const selectDate = (date) => { form.value.date = date; form.value.time = ""; };
            const availableTimes = computed(() => times.value.filter(t => String(t.date).trim() === String(form.value.date).trim()));
            
            const isFull = (timeStr) => {
                return reserves.value.some(r => 
                    String(r.date).trim() === String(form.value.date).trim() && 
                    String(r.time).trim() === String(timeStr).trim()
                );
            };

            const isFormValid = computed(() => {
                return form.value.class && form.value.name.trim() && form.value.email.trim() && form.value.date && form.value.time;
            });

            const submitReservation = async () => {
                if (!isFormValid.value) return;
                
                if (isDateClosed(form.value.date)) { alert("申し訳ありません、この日付の受付枠は締め切られました。"); return; }
                if (isFull(form.value.time)) { alert("申し訳ありません、タッチの差でこの時間枠が満席になりました。別の日時を選択してください。"); loadData(); return; }

                if (!confirm("この内容で予約を確定させます。よろしいですか？")) return;

                loading.value = true;
                try {
                    // 💡 GAS側の受け取り設定に合わせて、typeを「submitReservation」へ、dataの構造を最適化しました
                    const response = await fetch(GAS_URL, {
                        method: "POST",
                        body: JSON.stringify({ 
                            type: "submitReservation", 
                            data: { ...form.value } 
                        })
                    });
                    const result = await response.json();
                    
                    if (result.status === "exists") {
                        alert("⚠️ 申し訳ありません、タッチの差でこの時間枠が満席になりました。別の日時を選択してください。");
                        await loadData();
                    } else if (result.status === "error") {
                        alert("システムエラーが発生しました。");
                    } else {
                        alert("🎉 ご予約が正常に完了いたしました！\n入力されたアドレスへ自動控えメールをお送りしましたのでご確認ください。");
                        form.value = { class: "", name: "", meetingType: "対面形式", email: "", date: "", time: "", note: "" };
                        await loadData();
                    }
                } catch(e) {
                    alert("通信エラーが発生しました。予約がとれていない可能性があります。園まで直接ご連絡ください。");
                } finally { loading.value = false; }
            };

            onMounted(loadData);

            return { loading, classes, dates, form, availableTimes, isSystemClosed, isDateClosed, selectDate, isFull, isFormValid, submitReservation, formatDisplayDate };
        }
    }).mount('#app');
</script>
</body>
</html>
